name: Quality Audit CI

on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  compile_stable:
    name: Stable Compilation Suite
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Swatinem's Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # TODO: In the future if CI takes a lot of time and the project is large enough
      # TODO: consider testing cargo hakari and see if its worth adding it

      - name: Compile Project (All Features)
        run: cargo check --locked --all-features

      # TODO: If there is more room for tasks (in terms of time). Check based on
      # TODO: features more rigorously via a set of edge cases

  compile-msrv:
    name: MSRV Compilation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Swatinem's Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.92.0

      # TODO: Same with the compile_stable job

      - name: Compile Project (All Features)
        run: cargo check --locked --all-features

      # TODO: Again, same with the compile_stable job

  linting_formatting:
    name: Linting & Formatting Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Swatinem's Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Clippy & RustFMT
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run Clippy
        run: cargo clippy --workspace --exclude chronographer_bin --all-targets --all-features --locked -- -D warnings

      - name: Format The Code
        run: cargo fmt --all --check

  tests:
    name: Code-Related Tests Suite
    runs-on: ubuntu-latest
    needs: [linting_formatting, compile-msrv, compile_stable]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Swatinem's Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Doctests
        run: cargo test --doc --all-features --workspace

      - name: Install Cargo NexTest
        uses: taiki-e/install-action@nextest

      - name: Run Unit Tests
        run: cargo nextest run --workspace